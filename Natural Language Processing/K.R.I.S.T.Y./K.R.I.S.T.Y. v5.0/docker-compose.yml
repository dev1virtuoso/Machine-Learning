version: '3.8'

services:
  kristy-core:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: kristy_v5_orchestrator
    ports:
      - "5000:5000"
    volumes:
      - ./checkpoints:/opt/kristy_v5/checkpoints
    environment:
      - ROS2_ENABLED=false
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]