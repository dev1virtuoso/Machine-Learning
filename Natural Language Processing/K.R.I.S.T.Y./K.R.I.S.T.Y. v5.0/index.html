<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>K.R.I.S.T.Y. v5.0 Command Terminal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f111a;
            color: #cdd6f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .grid-wrapper {
            display: flex;
            max-width: 1400px;
            width: 100%;
            gap: 20px;
        }

        .left-terminal {
            flex: 1.2;
            background: #181825;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            border: 1px solid #313244;
        }

        .right-monitors {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .canvas-container {
            width: 100%;
            height: 400px;
            background: #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .panel {
            background: #1e1e2e;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #45475a;
        }

        #chatStream {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #313244;
            background: #11111b;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .bubble {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
        }

        .user-node {
            background: #313244;
            text-align: right;
            color: #a6e3a1;
        }

        .sys-node {
            background: #1e1e2e;
            border-left: 4px solid #89b4fa;
        }

        .input-bar {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #11111b;
            border: 1px solid #45475a;
            padding: 10px;
            color: #cdd6f4;
            border-radius: 6px;
        }

        button {
            background: #89b4fa;
            color: #11111b;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .meta-tag {
            display: block;
            font-size: 11px;
            color: #cba6f7;
            margin-top: 4px;
        }

        #validationOverlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(243, 139, 168, 0.2);
            border: 1px solid #f38ba8;
            color: #f38ba8;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
        }

        .debug-pane {
            display: none;
            background: #11111b;
            border: 1px solid #f38ba8;
            color: #fab387;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="grid-wrapper">
        <div class="left-terminal">
            <h3>K.R.I.S.T.Y. Operational Workspace Matrix</h3>
            <div id="chatStream"></div>
            <div class="input-bar">
                <input type="text" id="queryInput" placeholder="Enter multi-modal execution directive..." />
                <button onclick="dispatchInferenceRequest()">Execute</button>
            </div>

            <div style="margin-top: 15px;">
                <label style="font-size: 13px; color: #a6adc8;">
                    <input type="checkbox" id="debugToggle" onclick="toggleDebugPanel()" /> Expose Agent Execution Step
                    Traces
                </label>
                <div id="debugPanel" class="debug-pane">System initialized. Awaiting pipeline activation...</div>
            </div>

            <div style="margin-top: 15px;">
                <button style="background: #a6e3a1;" onclick="triggerBvhDownload()">Download Active Trajectory
                    (.BVH)</button>
            </div>
        </div>

        <div class="right-monitors">
            <div class="canvas-container">
                <div id="validationOverlay">CRITICAL ANOMALY: POSE ACCELERATION LIMIT BOUNDS EXCEEDED</div>
                <div id="threeCanvas" style="width: 100%; height: 100%;"></div>
            </div>
            <div class="panel">
                <h4>System Telemetry Diagnostics</h4>
                <div id="telemetryData" style="font-size: 13px; font-family: monospace; color: #bac2de;">
                    Cross-Modal Mapping Bounds: 0.00<br />
                    Simulated Flight Rewards: 0.00<br />
                    Active Graph Topology Hops: 0
                </div>
            </div>
            <div class="panel">
                <h4>Target Image Context</h4>
                <img id="imageMonitor" style="width: 100%; max-height: 180px; object-fit: contain; border-radius: 4px;"
                    src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                    alt="Contextual Layer" />
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, skeleton, spineBone, limbBone;
        let activeAnimationFrames = [];
        let currentFrameIndex = 0;
        let lastBvhData = "";

        function initThreeJSWorkspace() {
            const container = document.getElementById('threeCanvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050508);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 1.5, 4);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const grid = new THREE.GridHelper(10, 20, 0x45475a, 0x313244);
            scene.add(grid);

            // Construct hierarchical structural bones drive network
            const bones = [];
            const rootBone = new THREE.Bone();
            rootBone.position.set(0, 0.8, 0);
            bones.push(rootBone);

            spineBone = new THREE.Bone();
            spineBone.position.set(0, 0.3, 0);
            rootBone.add(spineBone);
            bones.push(spineBone);

            limbBone = new THREE.Bone();
            limbBone.position.set(0.2, 0.2, 0);
            spineBone.add(limbBone);
            bones.push(limbBone);

            skeleton = new THREE.Skeleton(bones);
            scene.add(rootBone);

            // Bind bones array layout structure to a visible helper framework
            const helper = new THREE.SkeletonHelper(rootBone);
            helper.material.linewidth = 3;
            scene.add(helper);

            animateSceneLoop();
        }

        function animateSceneLoop() {
            requestAnimationFrame(animateSceneLoop);

            if (activeAnimationFrames.length > 0) {
                const frame = activeAnimationFrames[currentFrameIndex];

                // Animate hierarchical joints safely step-by-step
                if (frame && frame.length >= 3) {
                    spineBone.rotation.z = frame[0] * 0.8;
                    spineBone.rotation.x = frame[1] * 0.5;
                    limbBone.rotation.y = frame[2] * 1.2;

                    // Pose Validation Check: Flag high acceleration anomalies
                    if (Math.abs(frame[0]) > 0.85) {
                        document.getElementById('validationOverlay').style.display = 'block';
                    } else {
                        document.getElementById('validationOverlay').style.display = 'none';
                    }
                }

                currentFrameIndex = (currentFrameIndex + 1) % activeAnimationFrames.length;
            }

            renderer.render(scene, camera);
        }

        function toggleDebugPanel() {
            const checked = document.getElementById('debugToggle').checked;
            document.getElementById('debugPanel').style.display = checked ? 'block' : 'none';
        }

        async function dispatchInferenceRequest() {
            const input = document.getElementById('queryInput');
            const stream = document.getElementById('chatStream');
            const query = input.value.trim();
            if (!query) return;

            // Display message on user interface
            const userBox = document.createElement('div');
            userBox.className = "bubble user-node";
            userBox.innerHTML = `<b>Operator:</b> ${query}`;
            stream.appendChild(userBox);
            input.value = "";

            try {
                const res = await fetch("/api/v5/inference", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: query })
                });

                const payload = await res.json();

                if (payload.error) {
                    const errorBox = document.createElement('div');
                    errorBox.className = "bubble sys-node";
                    errorBox.style.borderLeft = "4px solid #f38ba8";
                    errorBox.innerHTML = `<b>Error:</b> ${payload.error}`;
                    stream.appendChild(errorBox);
                    return;
                }

                // Render linguistic data mapping parameters
                const sysBox = document.createElement('div');
                sysBox.className = "bubble sys-node";
                sysBox.innerHTML = `<b>K.R.I.S.T.Y:</b> ${payload.text_response} <span class='meta-tag'>Intent Context ID: ${payload.intent}</span>`;
                stream.appendChild(sysBox);
                stream.scrollTop = stream.scrollHeight;

                // Bind payload to cache for file outputs
                if (payload.bvh_export) {
                    lastBvhData = payload.bvh_export;
                }

                // Append runtime debug traces
                document.getElementById('debugPanel').innerHTML = `[Trace Step Active] Routing execution for intent variant '${payload.intent}' completed successfully. Realignment Score: ${payload.alignment_score.toFixed(4)}`;

                // Update Telemetry Panel
                if (payload.telemetry) {
                    document.getElementById('telemetryData').innerHTML = `
                        Cross-Modal Mapping Bounds: ${payload.telemetry.cross_modal_consistency.toFixed(4)}<br/>
                        Simulated Flight Rewards: ${payload.telemetry.sim_reward.toFixed(4)}<br/>
                        Active Graph Topology Hops: ${payload.telemetry.hop_count}
                    `;
                }

                // Update Image monitor frame
                if (payload.image_base64) {
                    document.getElementById('imageMonitor').src = "data:image/jpeg;base64," + payload.image_base64;
                }

                // Push tracking values into kinematic rendering pipes
                if (payload.motion_data && payload.motion_data.length > 0) {
                    activeAnimationFrames = payload.motion_data;
                    currentFrameIndex = 0;
                }

            } catch (e) {
                console.error(e);
            }
        }

        function triggerBvhDownload() {
            if (!lastBvhData) {
                alert("No active trajectory data compiled yet.");
                return;
            }
            const blob = new Blob([lastBvhData], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "kristy_v5_motion_stream.bvh";
            link.click();
        }

        window.onload = () => {
            initThreeJSWorkspace();
        };
    </script>
</body>

</html>
