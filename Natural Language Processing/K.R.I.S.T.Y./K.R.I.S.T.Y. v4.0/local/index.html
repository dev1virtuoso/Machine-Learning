<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>K.R.I.S.T.Y. v4.0</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f111a;
            color: #cdd6f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .grid-wrapper {
            display: flex;
            max-width: 1300px;
            width: 100%;
            gap: 20px;
        }

        .left-terminal {
            flex: 1.2;
            background: #181825;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            border: 1px solid #313244;
        }

        .right-monitors {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .monitor-card {
            background: #181825;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #313244;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chat-stream {
            height: 480px;
            overflow-y: auto;
            border: 1px solid #45475a;
            border-radius: 8px;
            padding: 20px;
            background: #11111b;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 75%;
            word-break: break-all;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .user-node {
            align-self: flex-end;
            background: #89b4fa;
            color: #11111b;
            font-weight: 500;
        }

        .sys-node {
            align-self: flex-start;
            background: #313244;
            color: #cdd6f4;
            border: 1px solid #45475a;
        }

        .meta-tag {
            font-size: 0.75rem;
            color: #a6adc8;
            margin-top: 6px;
            display: block;
            border-top: 1px dashed #45475a;
            padding-top: 4px;
        }

        .input-panel {
            display: flex;
            margin-top: 15px;
            gap: 12px;
        }

        input {
            flex: 1;
            padding: 14px;
            background: #11111b;
            border: 1px solid #45475a;
            border-radius: 6px;
            color: #cdd6f4;
            font-size: 1rem;
        }

        input:focus {
            border-color: #89b4fa;
            outline: none;
        }

        button {
            padding: 14px 28px;
            background: #89b4fa;
            color: #11111b;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            background: #585b70;
            color: #a6adc8;
        }

        canvas {
            border: 1px solid #45475a;
            background: #11111b;
            border-radius: 8px;
            width: 100%;
            max-width: 360px;
            height: 240px;
        }

        .viewport-img {
            width: 100%;
            max-width: 240px;
            height: 240px;
            border: 1px solid #45475a;
            border-radius: 8px;
            background: #11111b;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <div class="grid-wrapper">
        <div class="left-terminal">
            <h3 style="margin-top:0; color:#89b4fa;">K.R.I.S.T.Y. Core Cluster Interactive Terminal</h3>
            <div class="chat-stream" id="chatStream"></div>
            <div class="input-panel">
                <input type="text" id="queryInput" placeholder="Initialize forward pass sequence...">
                <button id="dispatchBtn" onclick="sendQueryTurn()">EXECUTE</button>
            </div>
        </div>
        <div class="right-monitors">
            <div class="monitor-card">
                <h4 style="margin:0 0 12px 0; color:#f5e0dc;">LATENT IMAGE DECODER VIEW</h4>
                <img id="imageFrame" class="viewport-img" alt="[Waiting for latent visual matrix data...]">
            </div>
            <div class="monitor-card">
                <h4 style="margin:0 0 12px 0; color:#a6e3a1;">46-DoF MOVEMENT KINEMATICS RENDERER</h4>
                <canvas id="motionViewport" width="360" height="240"></canvas>
            </div>
        </div>
    </div>

    <script>
        const chatStream = document.getElementById('chatStream');
        const canvas = document.getElementById('motionViewport');
        const ctx = canvas.getContext('2d');
        let motionLoopId = null;

        function appendSecureMessage(actor, contentText, classType, telemetryStr = null) {
            const containerNode = document.createElement('div');
            containerNode.className = 'bubble ' + classType;
            const titleNode = document.createElement('b');
            titleNode.textContent = actor + ": ";
            containerNode.appendChild(titleNode);
            const textNode = document.createTextNode(contentText);
            containerNode.appendChild(textNode);

            if (telemetryStr) {
                const telemetryNode = document.createElement('span');
                telemetryNode.className = 'meta-tag';
                telemetryNode.textContent = telemetryStr;
                containerNode.appendChild(telemetryNode);
            }

            chatStream.appendChild(containerNode);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function renderKinematicsStream(sequenceFrames) {
            if (!sequenceFrames || sequenceFrames.length === 0) return;
            if (motionLoopId) cancelAnimationFrame(motionLoopId);

            let frameIdx = 0;
            const boneTopology = [[0, 1], [1, 2], [2, 3], [3, 4], [1, 5], [5, 6], [6, 7], [1, 8], [8, 9], [9, 10], [8, 11], [11, 12]];

            function runRenderer() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const currentFrame = sequenceFrames[frameIdx];

                const jointPoints = [];
                for (let i = 0; i < 46; i += 1) {
                    const rawX = currentFrame[i * 3] || 0;
                    const rawY = currentFrame[i * 3 + 1] || 0;
                    const confidence = currentFrame[i * 3 + 2] || 1.0;

                    const screenX = (rawX + 1) * (canvas.width / 2);
                    const screenY = (rawY + 1) * (canvas.height / 2);
                    jointPoints.push({ x: screenX, y: screenY, v: confidence });
                }

                ctx.strokeStyle = '#45475a';
                ctx.lineWidth = 2;
                boneTopology.forEach(pair => {
                    const fromJoint = jointPoints[pair[0]];
                    const toJoint = jointPoints[pair[1]];
                    if (fromJoint && toJoint && fromJoint.v > 0.1 && toJoint.v > 0.1) {
                        ctx.beginPath();
                        ctx.moveTo(fromJoint.x, fromJoint.y);
                        ctx.lineTo(toJoint.x, toJoint.y);
                        ctx.stroke();
                    }
                });

                jointPoints.forEach((pt, index) => {
                    if (pt.v > 0.1) {
                        ctx.fillStyle = index === 0 ? '#f38ba8' : '#a6e3a1';
                        ctx.globalAlpha = pt.v;
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, 4, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.globalAlpha = 1.0;
                    }
                });

                frameIdx = (frameIdx + 1) % sequenceFrames.length;
                motionLoopId = requestAnimationFrame(runRenderer);
            }
            runRenderer();
        }

        async function sendQueryTurn() {
            const inputField = document.getElementById('queryInput');
            const actionBtn = document.getElementById('dispatchBtn');
            const promptStr = inputField.value.trim();
            if (!promptStr) return;

            appendSecureMessage('USER', promptStr, 'user-node');
            inputField.value = '';
            inputField.disabled = actionBtn.disabled = true;

            try {
                const webResponse = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: promptStr })
                });

                const packet = await webResponse.json();
                if (webResponse.ok) {
                    const stats = `[TELEMETRY] Alignment: ${packet.alignment_score.toFixed(3)} | Intent Type: ${packet.intent} | Affective Label: ${packet.sentiment.label} (${packet.sentiment.score.toFixed(2)})`;
                    appendSecureMessage('K.R.I.S.T.Y.', packet.text_response, 'sys-node', stats);

                    if (packet.image_base64) {
                        document.getElementById('imageFrame').src = "data:image/jpeg;base64," + packet.image_base64;
                    }
                    if (packet.motion_data && packet.motion_data.length > 0) {
                        renderKinematicsStream(packet.motion_data);
                    }
                } else {
                    appendSecureMessage('GATEWAY ERROR', packet.error, 'sys-node');
                }
            } catch (networkException) {
                appendSecureMessage('TERMINAL CRITICAL', 'Could not establish connection to the remote multimodal engine endpoint.', 'sys-node');
            } finally {
                inputField.disabled = actionBtn.disabled = false;
                inputField.focus();
            }
        }

        document.getElementById('queryInput').addEventListener('keypress', e => {
            if (e.key === 'Enter' && !e.target.disabled) sendQueryTurn();
        });
    </script>
</body>

</html>
